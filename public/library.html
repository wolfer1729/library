<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Granthalaya Library</title>
  <meta name="description" content="Read and listen to great books in English, Hindi and Telugu, or add your own.">
  <meta name="theme-color" content="#0f6e66">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('appTheme') || 'null');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view" data-skip>Skip to content</a>
  <header class="topbar" id="topbar"></header>
  <main id="view" class="view" tabindex="-1"></main>
  <div id="player" class="player" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
